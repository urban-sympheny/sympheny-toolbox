<!DOCTYPE html>
<!--
  Interactive REST API explorer (Scalar). A first-class page of the REST API
  section: listed in the zensical.toml nav as "API Explorer" and linked from
  api/index.md. The static Markdown reference under api/reference/ stays
  canonical (searchable, cross-linked, in llms.txt); this page adds live
  "try it" on top of the same specification.

  Static, non-Markdown page copied verbatim into the built site by Zensical.
  The nav entry points at this file directly: a nav path Zensical cannot
  resolve to a Markdown page is treated as a URL and rewritten relative to
  each page. It opens in the same tab and has no site chrome, so the reader
  returns with the browser's back button.

  Loads the Scalar API reference from a version-pinned CDN and renders the
  committed OpenAPI spec, served alongside this file as ./openapi.json (emitted
  by scripts/generate_api_reference.py, kept current by its --check in CI).
  Removing it is a small delete: this file, the openapi.json copy, the copy
  step in scripts/generate_api_reference.py, and the nav entry.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sympheny API Explorer</title>
    <link rel="icon" href="../assets/favicon.ico" />
  </head>
  <body>
    <div id="app"></div>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.62.5"></script>
    <script>
      Scalar.createApiReference('#app', {
        url: 'openapi.json',
        // Privacy: no Scalar telemetry, and deliberately NO proxyUrl — "try it"
        // requests go straight from the visitor's browser to the Sympheny API,
        // never through a third-party proxy. (If the API does not send CORS
        // headers for this origin, in-browser requests fail; enable CORS on the
        // API rather than adding a proxy.)
        telemetry: false,
        // Preselect the spec's Auth0 bearer scheme so "try it" asks for a token
        // up front instead of an auth-scheme choice.
        authentication: { preferredSecurityScheme: 'HTTPBearer' },
        // The spec only exists as JSON; don't offer a converted YAML download.
        documentDownloadType: 'json',
        metaData: { title: 'Sympheny API Explorer' },
        favicon: '../assets/favicon.ico',
      })
    </script>
  </body>
</html>
