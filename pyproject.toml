[build-system]
requires = ["uv_build>=0.11.6,<0.12"]
build-backend = "uv_build"

[project]
name = "sympheny-toolbox"
version = "3.0.0"
description = "Lightweight Python wrapper for the Sympheny SaaS API to automate common workflows."
readme = "README.md"
requires-python = ">=3.11,<4"
license = "Apache-2.0"
keywords = [
  "sympheny",
  "energy",
  "optimization",
  "urban-planning",
  "sustainability",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: Implementation :: CPython",
]

dependencies = [
  "httpx>=0.27.0,<1",
  "openpyxl>=3.0.0,<4",
  "pydantic>=2.13.4",
]

[project.urls]
Homepage = "https://www.sympheny.com"
Documentation = "https://docs.sympheny.com"
Repository = "https://github.com/urban-sympheny/sympheny-toolbox.git"
Issues = "https://github.com/urban-sympheny/sympheny-toolbox/issues"

[dependency-groups]
dev = [
    "coverage>=7.15.0",
    "datamodel-code-generator>=0.66.3",
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
    "types-openpyxl>=3.1.5.20260518",
    "zensical==0.0.47",
]

# ──────────────────────────────────────────────
# RUFF
# ──────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 150

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "B",   # flake8-bugbear
  "I",   # isort
  "UP",  # pyupgrade
  "S",   # flake8-bandit (security)
  "C4",  # flake8-comprehensions
  "C90", # mccabe complexity
  "SIM", # flake8-simplify
  "TC",  # flake8-type-checking
  "RUF", # Ruff-specific rules
  "PT",  # flake8-pytest-style
]

ignore = [
  "B008",   # Function calls in default args (FastAPI Depends, etc.)
  "E741",   # Ambiguous variable names (e.g., l, O, I)
  "SIM112", # Check for environment variables that are not capitalized.
  "C416",   # Checks for unnecessary dict, list, and set comprehension.
  "B905",   # zip() without strict=
  "S104",   # hardcoded-bind-all-interfaces
]


[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"] # Allow assert in tests

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves field annotations at runtime; TC moves would break model creation.
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
lines-after-imports = 2
known-first-party = ["sympheny_toolbox"]


# ──────────────────────────────────────────────
# MYPY
# ──────────────────────────────────────────────
[tool.mypy]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
show_error_codes = true
check_untyped_defs = true
no_implicit_reexport = true
strict_equality = true
warn_unused_ignores = true
warn_return_any = true
warn_redundant_casts = true
exclude = ["docs"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ──────────────────────────────────────────────
# COVERAGE
# ──────────────────────────────────────────────
[tool.coverage.run]
branch = true
source = ["sympheny_toolbox"]
concurrency = ["thread"]

[tool.coverage.html]
directory = "test_reports/coverage_report"

# ──────────────────────────────────────────────
# PYTEST
# ──────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-s --durations=5"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
