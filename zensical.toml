# Zensical site configuration.
# Docs: https://zensical.org/docs/setup/basics/
#
# The markdown_extensions section below is the sanctioned authoring whitelist
# (see .agents/skills/docs/SKILL.md, ground rule 1): pages may use exactly the
# syntax these extensions enable, plus the <video> HTML exception. Extend the
# list deliberately — never work around it with raw HTML.
#
# Two extensions carry a narrowed sanction (added Phase 5b): md_in_html is
# permitted ONLY for the upstream `<div class="grid cards" markdown>` pattern on
# index/landing pages; pymdownx.emoji is permitted ONLY for bundled-set icon and
# arrow shortcodes (e.g. :material-web:, :octicons-arrow-right-24:) inside those
# cards. Neither licenses arbitrary raw HTML or decorative emoji elsewhere.

