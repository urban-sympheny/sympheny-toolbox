[project.theme]
logo = "assets/sympheny-logo-light.svg"
favicon = "assets/favicon.ico"
# custom_dir is sanctioned ONLY for overrides/main.html's announce block (the
# dismissible beta banner) — see the header comment and SKILL.md ground rule 1.
custom_dir = "overrides"
features = [
  "navigation.tabs",
  "navigation.indexes",
  "content.tabs.link",
  "content.code.copy",
  "search.highlight",
  "announce.dismiss",
]

# Brand color schemes: two-way light/dark toggle. The media queries make the
# FIRST visit follow the OS preference; after that the visitor's choice sticks.
# primary/accent = "custom" defer the actual colors to docs/stylesheets/extra.css.

# Light mode.
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# Dark mode.
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.extra]
generator = false

# Cookie consent (config-only — no analytics is wired yet, so nothing loads
# behind the consent). Users reopen this dialog via the footer "Change cookie
# settings" link. The privacy policy link uses HTML in the description, the
# upstream-documented pattern. The generic "Analytics" cookie is declared so
# "Manage settings" has something to manage; the stored consent flag will gate
# the analytics snippet once a provider is chosen (no re-consent needed).
[project.extra.consent]
title = "Cookie consent"
description = """We track page visits to see what's useful. No ads, no selling your data. See our <a href="https://www.sympheny.com/privacy">privacy policy</a>."""
actions = ["accept", "reject", "manage"]

[project.extra.consent.cookies.analytics]
name = "Analytics"
checked = true

# Link validation: invalid links and anchors are warnings, which --strict
# turns into build failures (Zensical's defaults; listed here to make the
# CI-enforced invariant explicit).
[project.validation]
invalid_links = true
invalid_link_anchors = true

# Sanctioned Markdown extension whitelist — see header comment.
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
# Zensical's bundled icon sets (material, octicons, …) + inline SVG rendering.
# Required explicitly: declaring our own markdown_extensions opts out of the
# upstream default emoji config, so the icon index would otherwise be empty.
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
